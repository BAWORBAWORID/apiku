<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Zyyvor Api'S</title>
    <meta name="description" content="The page you're looking for doesn't exist or has been moved.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://api.zyvor.my.id/">
    <link rel="icon" href="/src/images/logo.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/src/images/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, transparent 0%, #050505 70%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }

        .error-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #555;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            margin-bottom: 2.5rem;
        }

        .error-number {
            font-family: 'Syne', sans-serif;
            font-size: clamp(7rem, 20vw, 12rem);
            font-weight: 800;
            line-height: 0.9;
            color: rgba(255,255,255,0.08);
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            user-select: none;
        }

        .error-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .error-desc {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #fff;
            color: #050505;
        }

        .btn-primary:hover {
            background: #e5e5e5;
        }

        .btn-secondary {
            background: transparent;
            color: #999;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .btn-secondary:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }

        .footer-note {
            margin-top: 3rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #333;
            letter-spacing: 0.05em;
        }

        @media (max-width: 480px) {
            .actions { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 240px; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-badge">Error 404</div>
        <div class="error-number">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">The page you're looking for doesn't exist or has been moved.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home
            </a>
            <a href="/docs" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                Documentation
            </a>
        </div>
        <div class="footer-note">Zyyvor Api'S — v<span id="v">1.9.1</span></div>
    </div>
    <script>
        (async function() {
            try {
                const r = await fetch('/configuration');
                const c = await r.json();
                if (c.releases?.[0]?.version) document.getElementById('v').textContent = c.releases[0].version;
            } catch(e) {}
        })();
    </script>
</body>
</html>
